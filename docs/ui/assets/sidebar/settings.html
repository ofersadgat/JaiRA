<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="doc" content="ui/surfaces/sidebar">
<meta name="state" content="settings">
<meta name="captured" content="2026-11-16">
<meta name="reflects" content="shipped">
<title>sidebar · settings</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../mockup.css">
<link rel="stylesheet" href="sidebar.css">
<script>if (location.hash === "#dark") document.documentElement.dataset.theme = "dark";</script>
</head>
<body class="mockup">
<p class="mockup-caption">ui/surfaces/sidebar · settings</p>
<div class="mockup-stage is-bare" style="width: 318px; height: 560px">
  <!-- Settings open at Connections, read at its Agents section; one warning waiting -->
  <nav class="rsb open" aria-label="Sidebar">
    <div class="rsb-lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="rsb-rail">
      <div class="rsb-head"></div>
      <div class="rsb-items">
        <button class="rsb-item" title="All tasks"><span class="rsb-icon">▦</span><span class="rsb-cap">All tasks</span><span class="rsb-badge warn">1</span></button>
        <button class="rsb-item" title="All conversations"><span class="rsb-icon">✻</span><span class="rsb-cap">All chats</span><span class="rsb-badge ok">2</span></button>
        <span class="rsb-rule"></span>
        <button class="rsb-item" title="/Users/ofer/Code/jaira"><span class="rsb-ring running"><span class="rsb-tile" style="--hue: var(--p1)">ja<small>3m</small></span></span><span class="rsb-cap">jaira</span></button>
        <button class="rsb-item" title="/Users/ofer/Code/declarative-ai"><span class="rsb-ring waiting"><span class="rsb-tile" style="--hue: var(--p2)">de<small>12m</small></span></span><span class="rsb-cap">declarative-ai</span></button>
        <button class="rsb-item" title="/Users/ofer/.jaira"><span class="rsb-ring"><span class="rsb-tile" style="--hue: var(--p0)">ja</span></span><span class="rsb-cap">~/.jaira</span></button>
        <button class="rsb-item" title="open another project" aria-haspopup="menu"><span class="rsb-add">+</span><span class="rsb-cap">Open</span></button>
      </div>
      <div class="rsb-foot">
        <button class="rsb-item on" title="Settings" aria-current="page"><span class="rsb-icon">⚙</span><span class="rsb-cap">Settings</span><span class="rsb-badge warn">1</span></button>
      </div>
    </div>
    <div class="rsb-panel">
      <div class="rsb-phead" style="gap: 6px; padding: 0 8px"><button class="rsb-act" title="back to where you were" aria-label="Back" style="font-size: 16px">‹</button><span class="rsb-name app-title">Settings</span><span class="rsb-pill waiting">⚠ 1</span></div>
      <div class="rsb-drawer" style="padding-top: 2px">
        <div class="rsb-lrow"><span class="rsb-glyph">◐</span>Appearance</div>
        <div class="rsb-lrow on" aria-current="page"><span class="rsb-glyph">⏚</span>Connections</div>
        <div class="rsb-subs"><span class="rsb-sub on">Agents</span><span class="rsb-sub">Model APIs</span><span class="rsb-sub">Local models</span><span class="rsb-sub">MCP servers</span><span class="rsb-sub">Forges</span></div>
        <div class="rsb-lrow"><span class="rsb-glyph">▭</span>Machines</div>
        <div class="rsb-lrow"><span class="rsb-glyph">⬡</span>Models</div>
        <div class="rsb-lrow"><span class="rsb-glyph">⚒</span>Tools</div>
        <div class="rsb-lrow"><span class="rsb-glyph">▷</span>Runs</div>
        <div class="rsb-lrow"><span class="rsb-glyph">⛁</span>Data &amp; history</div>
        <div class="rsb-lrow"><span class="rsb-glyph">ⓘ</span>About</div>
      </div>
      <div class="rsb-pfoot">
        <div class="rsb-lrow"><span class="rsb-glyph">≡</span>Logs<span class="rsb-warn">⚠ 1</span></div>
        <div class="rsb-lrow"><span class="rsb-glyph">⌁</span>Debug</div>
        <div class="rsb-lrow"><span class="rsb-glyph">▤</span>Components</div>
        <div class="rsb-lrow" title="switch to dark"><span class="rsb-glyph">☾</span>Dark</div>
      </div>
    </div>
  </nav>
</div>
</body>
</html>
