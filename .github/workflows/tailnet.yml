# jaira-tailnet (decision 0013 §2): JaiRA's own way onto a tailnet, one binary per platform, packed as
# the per-platform npm packages the Tailscale plugin downloads (decision 0011 §6).
#
# Built on every change to packages/tailnet, with the binaries kept as run artifacts. Published only when
# run by hand with `publish` ticked, and only with an NPM_TOKEN secret that may publish under @jaira.
name: tailnet

on:
  push:
    paths: ["packages/tailnet/**", ".github/workflows/tailnet.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the per-platform packages to npm"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, npm: win32-x64, exe: jaira-tailnet.exe }
          - { goos: windows, goarch: arm64, npm: win32-arm64, exe: jaira-tailnet.exe }
          - { goos: darwin, goarch: arm64, npm: darwin-arm64, exe: jaira-tailnet }
          - { goos: darwin, goarch: amd64, npm: darwin-x64, exe: jaira-tailnet }
          - { goos: linux, goarch: amd64, npm: linux-x64, exe: jaira-tailnet }
          - { goos: linux, goarch: arm64, npm: linux-arm64, exe: jaira-tailnet }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The version the module says (tailscale.com decides it), so the build here and there agree.
          go-version-file: packages/tailnet/go.mod
          cache-dependency-path: packages/tailnet/go.sum
      - name: Build
        working-directory: packages/tailnet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "out/${{ matrix.exe }}" .
      - name: Pack
        working-directory: packages/tailnet
        run: |
          os="${{ matrix.npm }}"; os="${os%%-*}"; cpu="${{ matrix.npm }}"; cpu="${cpu##*-}"
          version="$(node -p "require('../app/package.json').version")"
          mkdir -p "pkg/${{ matrix.npm }}"
          cp "out/${{ matrix.exe }}" "pkg/${{ matrix.npm }}/"
          cp README.md "pkg/${{ matrix.npm }}/"
          cat > "pkg/${{ matrix.npm }}/package.json" <<EOF
          {
            "name": "@jaira/tailnet-${{ matrix.npm }}",
            "version": "${version}",
            "description": "JaiRA's Tailscale helper (tsnet) for ${{ matrix.npm }}",
            "license": "BSD-3-Clause",
            "os": ["${os}"],
            "cpu": ["${cpu}"],
            "files": ["${{ matrix.exe }}", "README.md"]
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: tailnet-${{ matrix.npm }}
          path: packages/tailnet/pkg/${{ matrix.npm }}
      - name: Publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        working-directory: packages/tailnet/pkg/${{ matrix.npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public

  # The root the plugin is built around (decision 0011 §6): one package whose optional dependencies are
  # the six platform packages, as esbuild does, so the lockfile resolves every platform and the manifest
  # can list them. Published after them.
  root:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack and publish @jaira/tailnet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./packages/app/package.json').version")"
          mkdir -p root && cd root
          cp ../packages/tailnet/README.md .
          node -e '
            const v = process.argv[1];
            const platforms = ["win32-x64", "win32-arm64", "darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64"];
            const pkg = {
              name: "@jaira/tailnet",
              version: v,
              description: "JaiRA\u0027s Tailscale helper (tsnet): the root of the Tailscale for JaiRA plugin",
              license: "BSD-3-Clause",
              files: ["README.md"],
              optionalDependencies: Object.fromEntries(platforms.map((p) => ["@jaira/tailnet-" + p, v])),
            };
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          ' "$version"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
