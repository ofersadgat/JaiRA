# jaira-tailnet (decision 0013 §2): JaiRA's own way onto a tailnet. Every installer carries the one for
# its platform, built while it is packaged (packages/app/buildTailnet.mjs); this only checks that it
# still compiles for all six whenever its source changes, which is quicker than a release finding out.
name: tailnet

on:
  push:
    paths: ["packages/tailnet/**", ".github/workflows/tailnet.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The version the module says (tailscale.com decides it), so the build here and there agree.
          go-version-file: packages/tailnet/go.mod
          cache-dependency-path: packages/tailnet/go.sum
      - name: Build
        working-directory: packages/tailnet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o /dev/null .
