name: CI

on:
  push:
    branches: [main]
  pull_request:

# JaiRA's packages depend on the sibling declarative-ai repo via
# `file:../../../declarative-ai/packages/*`. CI therefore checks out
# declarative-ai next to JaiRA and installs its deps first: the file: links are
# symlinks, so Node resolves the linked packages' own dependencies from
# declarative-ai/node_modules.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JaiRA
        uses: actions/checkout@v4
        with:
          path: JaiRA

      # declarative-ai is public, so the default token checks it out with no extra
      # config. If it is ever made private, add a PAT with read access as an
      # AI_EXEC_TOKEN secret and pass `token: ${{ secrets.AI_EXEC_TOKEN }}` here.
      # NOTE the checkout `path` must match the directory name in the file: deps.
      - name: Checkout declarative-ai sibling for file deps
        uses: actions/checkout@v4
        with:
          repository: ofersadgat/declarative-ai
          ref: main
          path: declarative-ai

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install declarative-ai deps
        run: npm install
        working-directory: declarative-ai

      - name: Install JaiRA deps
        run: npm install
        working-directory: JaiRA

      - name: Typecheck
        run: npm run typecheck
        working-directory: JaiRA

      - name: Test
        run: npm test
        working-directory: JaiRA
