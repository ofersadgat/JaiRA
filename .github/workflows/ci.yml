name: CI

on:
  push:
    branches: [main]
  pull_request:

# JaiRA's packages depend on the sibling declarative-ai repo via
# `file:../../../declarative-ai/packages/*`. CI therefore checks out
# declarative-ai next to JaiRA and installs its deps first: the file: links are
# symlinks, so Node resolves the linked packages' own dependencies from
# declarative-ai/node_modules.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JaiRA
        uses: actions/checkout@v4
        with:
          path: JaiRA

      # declarative-ai is public, so the default token checks it out with no extra
      # config. If it is ever made private, add a PAT with read access as an
      # AI_EXEC_TOKEN secret and pass `token: ${{ secrets.AI_EXEC_TOKEN }}` here.
      # NOTE the checkout `path` must match the directory name in the file: deps.
      - name: Checkout declarative-ai sibling for file deps
        uses: actions/checkout@v4
        with:
          repository: ofersadgat/declarative-ai
          ref: main
          path: declarative-ai

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install declarative-ai deps
        run: npm install
        working-directory: declarative-ai

      # The linked packages' `exports` point at `dist`, which is not committed, so
      # JaiRA's typecheck, tests and bundle all need declarative-ai built first.
      - name: Build declarative-ai
        run: npm run build
        working-directory: declarative-ai

      # codeview (gitlab.com/mistlabs/codeview) is private, and the lockfile names it
      # by SSH, which the runner has no key for: git reads it over HTTPS with a
      # read-only deploy token (the CODEVIEW_TOKEN secret, deploy token `jaira-ci`).
      - name: Install JaiRA deps
        env:
          CODEVIEW_TOKEN: ${{ secrets.CODEVIEW_TOKEN }}
        run: |
          codeview="https://jaira-ci:${CODEVIEW_TOKEN}@gitlab.com/mistlabs/codeview.git"
          git config --global url."$codeview".insteadOf ssh://git@gitlab.com/mistlabs/codeview.git
          git config --global --add url."$codeview".insteadOf https://gitlab.com/mistlabs/codeview.git
          npm install
        working-directory: JaiRA

      - name: Typecheck
        run: npm run typecheck
        working-directory: JaiRA

      - name: Test
        run: npm test
        working-directory: JaiRA

      # Bundles the Electron main/preload (esbuild) and the renderer (Vite). The
      # app is not launched in CI, but a broken build fails here.
      - name: Build app
        run: npm run app:build
        working-directory: JaiRA
