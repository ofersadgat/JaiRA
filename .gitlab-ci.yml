# JaiRA CI, and GitLab's release pipeline: the jobs are in `.gitlab/ci/pipeline.yml`.
#
# They run on the mistlabs group's own machines, and on GitLab's hosted runners only while those are
# down. A job's runner is fixed by its tags when it is created, so this pipeline first asks which
# machines are up (the `runners` job, `scripts/ci/runners.mjs`, on a small hosted runner: the one
# that is always there) and then starts the jobs as a child pipeline with their tags set. Run pipeline
# with RUNNERS = own or hosted to choose by hand.
#
# A release pipeline runs for:
#
# - a pushed `vX.Y.Z` tag: that commit, as stable; a `vX.Y.Z-nightly.YYYYMMDD.N`
#   tag: that commit, as that nightly (`npm run release-*-version -- --gitlab`);
# - Build > Pipelines > Run pipeline with RELEASE_CHANNEL = nightly (this
#   branch's commit) or stable (promotes the latest nightly's commit;
#   RELEASE_VERSION overrides its X.Y.Z);
# - a pipeline schedule with RELEASE_CHANNEL = nightly, were one set up — none is:
#   GitHub's schedule makes the nightlies. One would be skipped when nothing is new
#   since the last nightly, and at any hour but 2am Pacific.
stages:
  - runners
  - pipeline

variables:
  RELEASE_CHANNEL:
    value: "none"
    options: ["none", "nightly", "stable"]
    description: "none runs the checks. nightly builds this branch's commit; stable promotes the latest nightly."
  RELEASE_VERSION:
    value: ""
    description: "stable only: X.Y.Z (default: the latest nightly's X.Y.Z)"
  IOS_CHECK:
    value: "false"
    options: ["false", "true"]
    description: "true also builds an unsigned iOS archive of this branch on the Mac (no upload)."
  RUNNERS:
    value: "auto"
    options: ["auto", "own", "hosted"]
    description: "auto runs on the group's own machines while they are up, else on GitLab's hosted runners; own or hosted chooses."

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-nightly\.\d{8}\.\d+)?$/
      variables:
        RELEASE_EVENT: push
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RELEASE_CHANNEL == "nightly"
      variables:
        RELEASE_EVENT: schedule
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE_CHANNEL != "none"
      variables:
        RELEASE_EVENT: workflow_dispatch
    # As before release pipelines existed: branch pipelines only, no merge-request duplicates.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

runners:
  stage: runners
  tags: [saas-linux-small-amd64]
  image: node:22-alpine
  variables:
    GIT_DEPTH: 1
  script:
    - node scripts/ci/runners.mjs
  artifacts:
    paths: [runners/]
    expire_in: 1 week

pipeline:
  stage: pipeline
  needs: [runners]
  trigger:
    include:
      - artifact: runners/pipeline.yml
        job: runners
    strategy: depend
    # What Run pipeline or a schedule asked for, and not this file's defaults: they would stand over
    # what the runners job wrote into the child pipeline.
    forward:
      yaml_variables: false
      pipeline_variables: true
