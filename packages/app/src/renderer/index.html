<!doctype html>
<!-- data-palette is the DEFAULT palette (`DEFAULT_PALETTE`), stamped here so the first paint — before
     any script has read the saved preference — is already the one most people see. `applyAppearance`
     rewrites it, or removes it for classic, as soon as settings arrive. -->
<html lang="en" data-palette="ink">
  <head>
    <meta charset="utf-8" />
    <!-- The renderer loads only its own bundle; no remote code, no inline eval. worker-src and
         font-src exist for Monaco (CHANGESETS.md §7.3): its diff computation runs in a bundled
         worker ('self'; Vite may wrap one in a blob: URL), and its icons are a bundled font.
         Everything is still local — no CDN, per the §7.3 Electron rule.

         frame-src names the artifact scheme because an interactive artifact is loaded from it, and
         because WITHOUT the directive it falls through to default-src 'none' and the frame is
         refused before it is fetched. It admits that scheme and nothing else: a static artifact is
         still shown from srcdoc, which needs no allowance here and gets no scripts — this app's own
         script-src is inherited by such a frame, which is precisely why an interactive one cannot
         use srcdoc at all.

         'wasm-unsafe-eval' is for the TextMate tokenizer (`textmate.ts`): the grammars run on an
         Oniguruma WASM build, and instantiating WebAssembly is compilation, which a bare
         script-src 'self' refuses. It is the NARROW directive for exactly that — it permits
         WebAssembly and nothing else, and in particular does not permit eval() of JavaScript, which
         'unsafe-eval' would. The module is bundled and inlined, so this admits no remote code
         either; the §7.3 Electron rule stands.

         It was added after the app and the snapshot harness were found to disagree: the harness page
         carries no CSP, so WASM instantiated there and the figures showed the real grammars while
         the app quietly fell back to Monaco's own tokenizer. The harness now carries this same
         header, so it cannot pass where the app fails. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; font-src 'self'; frame-src jaira-artifact:"
    />
    <title>JaiRA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
